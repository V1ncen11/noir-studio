<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    /* Default for Light Mode Tabs */
    .n-line { stroke: #000000; }
    .s-line { stroke: #666666; }
    
    /* Auto-switch for Dark Mode Tabs */
    @media (prefers-color-scheme: dark) {
      .n-line { stroke: #ffffff; }
      .s-line { stroke: #aaaaaa; }
    }
  </style>
  
  <g transform="translate(50, 50) skewX(-15) translate(-50, -50)">
    <path class="n-line" d="M 30 70 V 30 L 70 70 V 30" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    <path class="s-line" d="M 70 30 C 70 5, 30 5, 30 30 C 30 50, 70 50, 70 70 C 70 95, 30 95, 30 70" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.9" />
  </g>
</svg>
